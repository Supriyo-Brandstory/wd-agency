<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">MyLanding</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#features">Features</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Build Something Amazing</h1>
  <p>Clean one-page landing using HTML, CSS & JS</p>
  <button onclick="scrollToContact()">Get Started</button>
</section>

<section class="features" id="features">
  <div class="card">Fast Performance</div>
  <div class="card">Responsive Design</div>
  <div class="card">Easy Customization</div>
</section>

<section class="contact" id="contact">
  <h2>Contact Us</h2>
  <form onsubmit="submitForm(event)">
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <button type="submit">Send</button>
  </form>
</section>

<footer>
  © 2026 MyLanding
</footer>

<script src="script.js"></script>
</body>
</html>
